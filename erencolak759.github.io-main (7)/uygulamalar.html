<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ödev Uygulamaları | Eren Çolak</title>
    <link rel="stylesheet" href="styles/style.css">
    <style>
        /* Ödeve Özel Tasarım (Eren'in Temasına Uygun) */
        .app-wrapper {
            padding: 30px;
            background-color: #ffffff;
        }

        /* Sekme (Tab) Menüsü Tasarımı */
        .tab-menu {
            display: flex;
            gap: 10px;
            border-bottom: 2px solid #8da6d6;
            margin-bottom: 25px;
        }
        .tab-btn {
            background-color: #f8f9fa;
            border: 1px solid #d0d4dc;
            border-bottom: none;
            padding: 12px 24px;
            font-size: 15px;
            cursor: pointer;
            border-radius: 4px 4px 0 0;
            transition: 0.3s;
            font-weight: bold;
            color: #555;
            font-family: Arial, sans-serif;
        }
        .tab-btn:hover {
            background-color: #e3eff3; /* Eren'in sidebar rengi */
        }
        .tab-btn.active {
            background-color: #8da6d6;
            color: white;
            border-color: #8da6d6;
        }

        /* Sekme İçerikleri */
        .app-content {
            display: none;
            animation: fadeIn 0.4s;
        }
        .app-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Form Tasarımları */
        .app-group {
            margin-bottom: 15px;
            max-width: 400px;
        }
        .app-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }
        .app-group input, .app-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }
        .app-group input:focus, .app-group select:focus {
            border-color: #8da6d6;
            outline: none;
            box-shadow: 0 0 4px rgba(141, 166, 214, 0.3);
        }
        .btn-calc {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            background-color: #007bff; /* Eren'in buton rengi */
            transition: background-color 0.3s ease;
            margin-top: 10px;
            font-family: Arial, sans-serif;
        }
        .btn-calc:hover {
            background-color: #0056b3;
        }

        /* Sonuç Kutuları */
        .result-box {
            margin-top: 25px;
            padding: 15px 20px;
            background-color: #fbeed2; /* Eren'in content-left rengi */
            border: 1px solid #eadbba;
            border-radius: 4px;
            display: none;
            max-width: 400px;
        }
        .result-box h3 { 
            margin-top: 0; 
            margin-bottom: 15px; 
            color: #333; 
            font-size: 18px; 
            border-bottom: 1px solid rgba(0,0,0,0.1); 
            padding-bottom: 10px;
        }
        .result-box p { margin: 8px 0; color: #444; }
        
        .result-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            font-weight: bold;
            text-align: center;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="header-top">
                <h1>Eren Çolak</h1>
                <nav>
                    <ul>
                        <li><a href="index.html">Ana Sayfa</a></li>
                        <li><a href="about.html">Hakkında</a></li>
                        <li><a href="interest.html">İlgi Alanlarım</a></li>
                        <li><a href="uygulamalar.html" class="active">Uygulamalar</a></li>
                        <li><a href="contact.html">İletişim</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <div class="app-wrapper">
            
            <div class="tab-menu">
                <button class="tab-btn active" onclick="sekmeyiAc(event, 'not-uygulamasi')">Not Hesaplama</button>
                <button class="tab-btn" onclick="sekmeyiAc(event, 'birim-uygulamasi')">Birim Dönüştürücü</button>
            </div>

            <div id="not-uygulamasi" class="app-content active">
                <h2 style="margin-bottom: 15px; font-size: 20px;">Öğrenci Not Hesaplama</h2>
                
                <div class="app-group">
                    <label for="adSoyad">Ad Soyad:</label>
                    <input type="text" id="adSoyad" placeholder="Örn: Filiz Akın">
                </div>
                <div class="app-group">
                    <label for="vizeNotu">Vize Notu:</label>
                    <input type="number" id="vizeNotu" placeholder="0 - 100" min="0" max="100">
                </div>
                <div class="app-group">
                    <label for="finalNotu">Final Notu:</label>
                    <input type="number" id="finalNotu" placeholder="0 - 100" min="0" max="100">
                </div>
                
                <button class="btn-calc" onclick="hesaplaNot()">Hesapla</button>

                <div id="notSonuc" class="result-box">
                    <h3 id="sonucIsim"></h3>
                    <p><strong>Ortalama:</strong> <span id="sonucOrtalama"></span></p>
                    <p><strong>Harf Notu:</strong> <span id="sonucHarf"></span></p>
                    <p><strong>Durum:</strong> <span id="sonucDurum"></span></p>
                </div>
            </div>

            <div id="birim-uygulamasi" class="app-content">
                <h2 style="margin-bottom: 15px; font-size: 20px;">Birim Dönüştürücü</h2>
                <p style="margin-bottom: 20px; color: #555; font-size: 14px;">Farklı mühendislik birimlerini birbirine dönüştürün.</p>
                
                <div class="app-group">
                    <label for="donusumDegeri">Değer Giriniz:</label>
                    <input type="number" id="donusumDegeri" placeholder="Örn: 50">
                </div>
                <div class="app-group">
                    <label for="donusumTipi">Dönüşüm Tipi:</label>
                    <select id="donusumTipi">
                        <option value="celsius-fahrenheit">Celsius -> Fahrenheit</option>
                        <option value="metre-kilometre">Metre -> Kilometre</option>
                        <option value="kilogram-gram">Kilogram -> Gram</option>
                    </select>
                </div>
                
                <button class="btn-calc" onclick="hesaplaDonusum()">Hesapla</button>
                
                <div id="donusumSonuc" class="result-box result-success">
                    Sonuç: <span id="sonucDeger"></span>
                </div>
            </div>

        </div>

        <footer>
            <p>© 2026 Eren Çolak. Tüm hakları saklıdır.</p>
        </footer>
    </div>

    <script>
        // Sekme Değiştirme
        function sekmeyiAc(secilenEvent, uygulamaId) {
            const tumIcerikler = document.getElementsByClassName("app-content");
            for (let i = 0; i < tumIcerikler.length; i++) {
                tumIcerikler[i].classList.remove("active");
            }
            const tumButonlar = document.getElementsByClassName("tab-btn");
            for (let i = 0; i < tumButonlar.length; i++) {
                tumButonlar[i].classList.remove("active");
            }
            document.getElementById(uygulamaId).classList.add("active");
            secilenEvent.currentTarget.classList.add("active");
        }

        // Not Hesaplama
        function hesaplaNot() {
            const adSoyad = document.getElementById('adSoyad').value;
            const vize = parseFloat(document.getElementById('vizeNotu').value);
            const final = parseFloat(document.getElementById('finalNotu').value);

            if (!adSoyad || isNaN(vize) || isNaN(final)) {
                alert("Lütfen tüm alanları eksiksiz doldurun.");
                return;
            }

            const ortalama = (vize * 0.4) + (final * 0.6);
            let harfNotu = "";
            let durum = ortalama >= 50 ? "Geçti" : "Kaldı";

            if (ortalama >= 90) harfNotu = "AA";
            else if (ortalama >= 80) harfNotu = "BA";
            else if (ortalama >= 70) harfNotu = "BB";
            else if (ortalama >= 60) harfNotu = "CB";
            else if (ortalama >= 50) harfNotu = "CC";
            else if (ortalama >= 40) harfNotu = "DC";
            else if (ortalama >= 30) harfNotu = "DD";
            else harfNotu = "FF";

            document.getElementById('sonucIsim').innerText = adSoyad;
            document.getElementById('sonucOrtalama').innerText = ortalama.toFixed(2);
            document.getElementById('sonucHarf').innerText = harfNotu;
            document.getElementById('sonucDurum').innerText = durum;
            document.getElementById('notSonuc').style.display = "block";
        }

        // Birim Dönüştürücü
        function hesaplaDonusum() {
            const deger = parseFloat(document.getElementById('donusumDegeri').value);
            const tip = document.getElementById('donusumTipi').value;

            if (isNaN(deger)) {
                alert("Lütfen geçerli bir sayı girin.");
                return;
            }

            let sonuc = 0;
            if (tip === "celsius-fahrenheit") sonuc = (deger * 9/5) + 32;
            else if (tip === "metre-kilometre") sonuc = deger / 1000;
            else if (tip === "kilogram-gram") sonuc = deger * 1000;

            document.getElementById('sonucDeger').innerText = sonuc.toLocaleString('tr-TR');
            document.getElementById('donusumSonuc').style.display = "block";
        }
    </script>
</body>
</html>
